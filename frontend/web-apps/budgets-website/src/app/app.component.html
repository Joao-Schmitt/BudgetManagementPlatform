<router-outlet />
<z-toaster
  position="top-right"
  [duration]="4200"
  [closeButton]="true"
  [richColors]="false"
  [toastOptions]="{
    unstyled: true,
    classes: {
      toast: 'group pointer-events-auto flex w-full items-start gap-3 rounded-2xl border px-4 py-3 shadow-2xl shadow-slate-950/10 backdrop-blur-xl transition-all',
      title: 'text-sm font-semibold leading-5',
      description: 'mt-1 text-sm leading-5 opacity-90',
      closeButton: 'rounded-full border border-white/20 bg-white/10 text-current transition hover:bg-white/20',
      success: 'border-emerald-200/80 bg-emerald-50/96 text-emerald-950',
      warning: 'border-amber-200/80 bg-amber-50/96 text-amber-950',
      error: 'border-rose-200/80 bg-rose-50/96 text-rose-950',
      info: 'border-violet-200/80 bg-violet-50/96 text-violet-950',
      default: 'border-slate-200/80 bg-white/96 text-slate-950'
    }
  }"
/>
