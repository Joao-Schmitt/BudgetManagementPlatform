<app-auth-shell
  title="Crie a base segura do seu workspace."
  description="Abra sua conta, configure o acesso e prepare a autenticacao em duas etapas logo no primeiro uso."
  alternateLabel="Ja tem conta?"
  alternateLink="/login"
  alternateText="Fazer login"
>
  <section class="auth-panel">
    <header class="auth-panel__header">
      <div class="auth-panel__badge" aria-hidden="true">
        <ng-icon name="lucideUserRound" class="size-4" />
      </div>
      <h2>Criar conta</h2>
      <p>Preencha seus dados para iniciar o onboarding.</p>
    </header>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <span>Nome</span>
      <div class="field__control">
        <span class="field__icon" aria-hidden="true">
          <ng-icon name="lucideUserRound" class="size-4" />
        </span>
        <input z-input type="text" formControlName="name" placeholder="Seu nome completo" />
      </div>
    </label>

    <label class="field">
      <span>E-mail</span>
      <div class="field__control">
        <span class="field__icon" aria-hidden="true">
          <ng-icon name="lucideMail" class="size-4" />
        </span>
        <input z-input type="email" formControlName="email" placeholder="voce@empresa.com" />
      </div>
    </label>

    <label class="field">
      <span>Senha</span>
      <div class="field__control">
        <span class="field__icon" aria-hidden="true">
          <ng-icon name="lucideLockKeyhole" class="size-4" />
        </span>
        <input z-input type="password" formControlName="password" placeholder="Crie uma senha" />
      </div>
    </label>

    <label class="field">
      <span>Confirmar senha</span>
      <div class="field__control">
        <span class="field__icon" aria-hidden="true">
          <ng-icon name="lucideLockKeyhole" class="size-4" />
        </span>
        <input z-input type="password" formControlName="confirmPassword" placeholder="Repita a senha" />
      </div>
    </label>

      <button type="submit" z-button zFull class="submit-button" [zLoading]="submitting()" [disabled]="submitting()">
        {{ submitting() ? 'Criando conta...' : 'Criar conta' }}
      </button>
    </form>
  </section>
</app-auth-shell>
