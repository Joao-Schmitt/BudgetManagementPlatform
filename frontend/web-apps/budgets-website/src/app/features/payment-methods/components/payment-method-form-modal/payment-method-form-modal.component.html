<div class="dialog-backdrop" (click)="close.emit()">
  <z-card class="modal-panel modal-panel--sm" (click)="$event.stopPropagation()">
    <header class="modal-header">
      <div>
        <p class="modal-eyebrow">Cadastro de forma de pagamento</p>
        <h2>{{ title() }}</h2>
      </div>

      <button type="button" z-button zType="ghost" zSize="icon" (click)="close.emit()" aria-label="Fechar popup">x</button>
    </header>

    <form class="form-grid" [formGroup]="form" (ngSubmit)="save()">
      <label class="field field--full">
        <span>Nome</span>
        <input z-input type="text" formControlName="nome" placeholder="Ex.: Pix, Boleto, Cartao" />
        @if (hasError('nome', 'required')) {
          <small>Informe o nome da forma de pagamento.</small>
        }
      </label>

      <label class="field field--full">
        <span>Tipo</span>
        <input z-input type="text" formControlName="tipo" placeholder="Ex.: Pix, Cartao, Dinheiro" />
        @if (hasError('tipo', 'required')) {
          <small>Informe o tipo da forma de pagamento.</small>
        }
      </label>

      <footer class="modal-actions field--full">
        <button type="button" z-button zType="outline" (click)="close.emit()">Cancelar</button>
        <button type="submit" z-button [zLoading]="saving()" [disabled]="saving()">
          {{ saving() ? 'Salvando...' : 'Salvar forma de pagamento' }}
        </button>
      </footer>
    </form>
  </z-card>
</div>
