<section class="service-page">
  @if (errorMessage(); as message) {
    <div class="feedback feedback--error" role="alert">{{ message }}</div>
  }

  <app-entity-grid
    [eyebrow]="'Cadastro'"
    [title]="'Servicos'"
    [summary]="serviceCountLabel()"
    [loading]="loading()"
    [columns]="gridColumns"
    [rows]="gridRows()"
    [busyRowId]="busyServiceId()"
    [emptyTitle]="'Nenhum servico cadastrado'"
    [emptyDescription]="'Comece adicionando o primeiro servico para organizar a oferta.'"
    addLabel="Adicionar"
    (add)="openCreateModal()"
    (edit)="openEditModal($event.id)"
    (duplicate)="openDuplicateModal($event.id)"
    (delete)="deleteService($event)"
  />

  @if (modalState()) {
    <app-service-form-modal
      [title]="modalTitle()"
      [saving]="saving()"
      [initialValue]="modalInitialValue()"
      (close)="closeModal()"
      (submitForm)="saveService($event)"
    />
  }
</section>
